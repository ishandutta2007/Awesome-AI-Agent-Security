<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bg-grad); }
    .grid { fill: url(#cyber-grid); }
    
    /* Dynamic Floating Particles / Orbs in Background */
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.25; }
      50% { transform: translate(50px, -20px) scale(1.15); opacity: 0.45; }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.2; }
      50% { transform: translate(-40px, 30px) scale(1.1); opacity: 0.4; }
    }
    @keyframes pulseShield {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 25px rgba(129, 140, 248, 0.8)); }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes scanLine {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: translateY(350px); opacity: 0; }
    }

    .orb-1 { animation: floatOrb1 9s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: floatOrb2 12s ease-in-out infinite; transform-origin: 1000px 240px; }
    .shield-icon { animation: pulseShield 4s ease-in-out infinite; transform-origin: 120px 170px; }
    
    .circuit-beam {
      stroke-dasharray: 60 120;
      animation: beamFlow 10s linear infinite;
    }
    .scanner {
      animation: scanLine 6s linear infinite;
    }

    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 50px;
      letter-spacing: -0.5px;
      fill: #f8fafc;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 0.5px;
      fill: #94a3b8;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #cbd5e1;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="340" rx="16" class="bg" />
  <rect width="1200" height="340" rx="16" class="grid" />

  <!-- Dynamic Background Lights (Stay securely in background) -->
  <circle cx="200" cy="120" r="140" fill="#38bdf8" filter="url(#glow)" class="orb-1" />
  <circle cx="1020" cy="220" r="160" fill="#818cf8" filter="url(#glow)" class="orb-2" />
  <circle cx="600" cy="170" r="120" fill="#c084fc" filter="url(#glow)" opacity="0.12" />

  <!-- Dynamic Scanning Laser -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#primary-grad)" stroke-width="1.5" class="scanner" />

  <!-- Circuit Stream Lines (Background) -->
  <path d="M 0 80 Q 300 120 600 60 T 1200 90" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.25" class="circuit-beam" />
  <path d="M 0 280 Q 400 220 800 290 T 1200 250" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.25" class="circuit-beam" />

  <!-- Shield / Security Core Graphic (Left side) -->
  <g class="shield-icon">
    <polygon points="120,80 185,110 185,185 120,245 55,185 55,110" fill="url(#shield-grad)" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 120 110 L 160 130 L 160 180 L 120 220 L 80 180 L 80 130 Z" fill="#0f172a" opacity="0.85" stroke="#818cf8" stroke-width="1.5" />
    <!-- Lock / Core Checkmark Symbol -->
    <path d="M 105 165 L 115 175 L 138 150" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Content Group (Foreground: Title & Subtitles Protected) -->
  <g transform="translate(240, 0)">
    <!-- Category Pill Tagline -->
    <g transform="translate(0, 82)">
      <rect x="0" y="0" width="280" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <circle cx="14" cy="13" r="4" fill="#38bdf8" />
      <text x="26" y="17.5" class="tagline">Next-Gen Agent Defense</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="152" class="main-title">
      Awesome AI Agent Security
    </text>

    <!-- Subtitle -->
    <text x="0" y="196" class="subtitle">
      Guardrails, Runtime Defenses, Prompt Injection &amp; Memory Poisoning Shields
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 232)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="18" y="20.5" class="pill-text">🛡️ Guardrails</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(142, 0)">
        <rect width="185" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="18" y="20.5" class="pill-text">💉 Prompt Injection</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(339, 0)">
        <rect width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="18" y="20.5" class="pill-text">🧠 Memory Defense</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(521, 0)">
        <rect width="160" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="18" y="20.5" class="pill-text">🎯 Red Teaming</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(693, 0)">
        <rect width="175" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="18" y="20.5" class="pill-text">⚡ Runtime Safety</text>
      </g>
    </g>
  </g>
</svg>
